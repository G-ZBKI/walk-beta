<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>walk-beta</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="stage" aria-label="walk-beta">
      <canvas id="scene"></canvas>
      <section id="main-menu" aria-label="Main menu">
        <div class="menu-panel">
          <p class="kicker">walk-beta</p>
          <h1>Courtyard Trial</h1>
          <p id="menu-text">
            Explore a Chinese courtyard, walk with keyboard or mouse, and use the portal for a future second scene.
          </p>
          <div class="menu-actions">
            <button id="start-game" type="button">Start Game</button>
            <button id="show-controls" type="button">Controls</button>
          </div>
        </div>
      </section>
      <p id="status" role="status">Start from the menu</p>
      <p id="fps-counter" aria-label="Frames per second">FPS 0</p>
      <section id="loading-screen" aria-live="polite" aria-label="Loading world">
        <div class="loading-panel">
          <p>Loading</p>
          <div class="progress-track" aria-hidden="true">
            <span id="loading-progress"></span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js?v=cheat-fly-20260828"></script>
  </body>
</html>
